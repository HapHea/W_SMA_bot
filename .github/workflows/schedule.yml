name: Weekly Stock Screener

on:
  schedule:
    # 매주 토요일 오전 11시 37분 (한국시간 기준) = UTC 기준 토요일 2시 37분
    - cron: '37 2 * * 6'
  workflow_dispatch: # 버튼을 눌러 수동으로 실행할 수 있게 해주는 옵션

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write # keepalive 액션이 더미 커밋을 남길 수 있도록 쓰기 권한 추가
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance finance-datareader pandas requests

    - name: Run Python script
      env:
        # GitHub Secrets에 등록한 토큰과 챗아이디를 불러옵니다.
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: Keepalive Workflow
      uses: gautamkrishnar/keepalive-workflow@v2
